<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0D">
  <title>Kontak · Linkert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="icon-btn" href="index.html" aria-label="Kembali ke profil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span class="brand">Linkert<span class="brand-dot">.</span></span>
      <button class="icon-btn" id="btn-share" type="button" aria-label="Bagikan profil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      </button>
    </header>

    <section class="profile" aria-labelledby="nama">
      <div class="avatar-ring">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
      </div>
      <p class="org" id="organisasi"></p>
      <h1 class="name" id="nama"></h1>
      <p class="role" id="jabatan"></p>
    </section>

    <nav class="socials" aria-label="Sosial media">
      <a class="social" id="link-instagram" target="_blank" rel="noopener">
        <span class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
        </span>
        <span class="social-label">Instagram</span>
      </a>
      <a class="social" id="link-linkedin" target="_blank" rel="noopener">
        <span class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </span>
        <span class="social-label">LinkedIn</span>
      </a>
      <a class="social" id="link-whatsapp" target="_blank" rel="noopener">
        <span class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>
        </span>
        <span class="social-label">WhatsApp</span>
      </a>
      <a class="social" id="link-email">
        <span class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </span>
        <span class="social-label">Email</span>
      </a>
    </nav>

    <section class="details" aria-label="Informasi kontak">
      <div class="detail-row">
        <span class="detail-label">Telepon</span>
        <span class="detail-value" id="telepon"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Email</span>
        <span class="detail-value" id="email"></span>
      </div>
    </section>

    <div class="actions">
      <a class="btn btn-primary" id="btn-save-contact">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
        Simpan ke Kontak
      </a>
    </div>

    <footer class="footer">
      Dibuat dengan <a href="https://linkert.id">Linkert</a>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
